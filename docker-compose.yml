version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: food-delivery-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: food-delivery-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  mongo:
    image: mongo:7.0
    container_name: food-delivery-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  order-service:
    build: ./order-service
    container_name: food-delivery-order
    ports:
      - "8080:8080"
    depends_on:
      - kafka
      - mongo
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongo:27017/order_db

  admin-service:
    build: ./admin-service
    container_name: food-delivery-admin
    ports:
      - "8081:8081"
    depends_on:
      - kafka
      - mongo
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongo:27017/admin_db

  restaurant-service:
    build: ./restaurant-service
    container_name: food-delivery-restaurant
    ports:
      - "9091:9091"
    depends_on:
      - kafka
      - mongo
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongo:27017/restaurant_db

  customer-service:
    build: ./customer-service
    container_name: food-delivery-customer
    ports:
      - "9090:9090"
    depends_on:
      - kafka
      - mongo
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongo:27017/customer_db

  payment-service:
    build: ./payment-service
    container_name: food-delivery-payment
    ports:
      - "9093:9093"
    depends_on:
      - kafka
      - mongo
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongo:27017/payment_db

  delivery-service:
    build: ./delivery-service
    container_name: food-delivery-delivery
    ports:
      - "9094:9094"
    depends_on:
      - kafka
      - mongo
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092
      BAL_CONFIG_VAR_MONGOURL: mongodb://mongo:27017/delivery_db

  notification-service:
    build: ./notification-service
    container_name: food-delivery-notification
    depends_on:
      - kafka
    environment:
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:29092

volumes:
  mongo-data:
