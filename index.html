<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Food Delivery Platform</title>
<style>
:root{color-scheme:light dark;--bg:#eef3f1;--card:#fff;--ink:#10201e;--mut:#5b6b68;--acc:#0b6e4f;--hi:#f2a900;--line:#d3dedb;--bad:#c92a2a}
@media(prefers-color-scheme:dark){:root{--bg:#0e1a18;--card:#15262a;--ink:#e8f1ee;--mut:#8fa5a0;--acc:#3ecf9a;--hi:#ffc233;--line:#26403b;--bad:#ff8787}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;background:var(--acc);color:#fff}
header h1{margin:0;font-size:20px;letter-spacing:.2px}
header span{font-size:13px;opacity:.9;margin-right:8px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:14px 24px}
main{max-width:1000px;margin:0 auto;padding:0 24px 48px}
h2{font-size:17px;margin:22px 0 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:6px}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
header button{background:transparent;border-color:#fff;color:#fff}
button:disabled{opacity:.45;cursor:default}
input{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);min-width:240px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.mut{color:var(--mut);font-size:13px}
.err{color:var(--bad);font-size:13px;margin-left:8px}
.pill{font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--line)}
.pill.bad{color:var(--bad)}
.big{font-size:28px;font-weight:700}
.trk{display:flex;align-items:center;margin:12px 0 6px}
.trk b{width:10px;height:10px;border-radius:50%;background:var(--line);flex:none;position:relative}
.trk b+b{margin-left:26px}
.trk b+b:before{content:"";position:absolute;right:100%;top:50%;width:26px;height:2px;margin-right:0;background:var(--line);transform:translateY(-50%)}
.trk b.p,.trk b.p:before,.trk b.c:before{background:var(--acc)}
.trk b.c{width:14px;height:14px;background:var(--hi);box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--hi)}
</style>
</head>
<body>
<header><h1>Food Delivery Platform</h1><div><span id="mode"></span><button id="tog">Switch demo / live</button></div></header>
<nav id="nav"></nav>
<main id="view"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// ---- Adjust these to match your services ----
const CFG={orders:'http://localhost:8082',admin:'http://localhost:8081/admin',customerId:'c1'};
const FLOW=['CREATED','CONFIRMED','PREPARING','READY','OUT_FOR_DELIVERY','DELIVERED'];
const NEXT={CREATED:['CONFIRMED','Confirm order'],CONFIRMED:['PREPARING','Start preparing'],PREPARING:['READY','Mark ready'],READY:['OUT_FOR_DELIVERY','Pick up'],OUT_FOR_DELIVERY:['DELIVERED','Mark delivered']};
const MENU=[
 {id:'r1',name:'Windhoek Grill',items:[{itemId:'i1',name:'Burger',price:50},{itemId:'i2',name:'Chips',price:20},{itemId:'i3',name:'Kapana plate',price:65}]},
 {id:'r2',name:'Okahandja Kitchen',items:[{itemId:'i4',name:'Chicken wrap',price:45},{itemId:'i5',name:'Fruit juice',price:18}]}];
const TABS={customer:'Customer',restaurant:'Restaurant',delivery:'Delivery',admin:'Admin'};
let live=false,orders=[],cart={},tab='customer',rid='r1',addr='Windhoek',msg='';
const money=n=>'N$ '+Number(n).toFixed(2);

async function api(base,path,opt={}){
 const r=await fetch(base+path,{headers:{'Content-Type':'application/json'},...opt});
 if(!r.ok)throw new Error(path+' returned '+r.status);
 return r.json();
}
async function load(){
 if(!live)return;
 try{orders=await api(CFG.orders,'/orders');msg=''}
 catch(e){msg='Order service unreachable: '+e.message}
}
async function setStatus(id,s){
 try{
  if(live){await api(CFG.orders,`/orders/${encodeURIComponent(id)}/status`,{method:'PUT',body:JSON.stringify({status:s})});await load()}
  else orders.find(o=>o.orderId===id).status=s;
 }catch(e){msg=e.message}
 render();
}
async function place(){
 const r=MENU.find(m=>m.id===rid);
 const items=r.items.filter(i=>cart[i.itemId]).map(i=>({itemId:i.itemId,name:i.name,quantity:cart[i.itemId],price:i.price}));
 if(!items.length)return;
 const o={orderId:'o'+Date.now(),customerId:CFG.customerId,restaurantId:rid,items,
  totalAmount:items.reduce((t,i)=>t+i.price*i.quantity,0),deliveryAddress:addr,status:'CREATED'};
 try{
  if(live)await api(CFG.orders,'/orders',{method:'POST',body:JSON.stringify(o)});else orders.push(o);
  cart={};await load();msg='';
 }catch(e){msg=e.message}
 render();
}
async function metrics(){
 if(live)return api(CFG.admin,'/metrics');
 const n=orders.length,c=orders.filter(o=>o.status==='CANCELLED').length;
 return{total_revenue:orders.reduce((t,o)=>t+o.totalAmount,0),total_orders:n,total_cancellations:c,
  cancellation_ratio_percentage:n?c/n*100:0,last_synchronized:new Date().toISOString()};
}

const pill=s=>`<span class="pill ${s==='CANCELLED'?'bad':''}">${esc(s.replace(/_/g,' ').toLowerCase())}</span>`;
const track=s=>{const i=FLOW.indexOf(s);return`<div class="trk" aria-label="${esc(s)}">${FLOW.map((x,k)=>`<b class="${i<0?'':k<i?'p':k===i?'c':''}" title="${x}"></b>`).join('')}</div>`};
const btns=(o,cancel)=>{
 const n=NEXT[o.status],id=esc(o.orderId);
 return(n?`<button class="pri" data-id="${id}" data-s="${n[0]}">${n[1]}</button>`:'')+
  (cancel&&['CREATED','CONFIRMED'].includes(o.status)?`<button data-id="${id}" data-s="CANCELLED">Cancel order</button>`:'');
};
const orderCard=(o,acts)=>`<div class="card"><b>${esc(o.orderId)}</b> ${pill(o.status)}
 <div class="mut">${o.items.map(i=>i.quantity+' x '+esc(i.name)).join(', ')}</div>
 <div class="mut">Deliver to ${esc(o.deliveryAddress)}, total ${money(o.totalAmount)}</div>${track(o.status)}<div class="row">${acts}</div></div>`;
const picker=()=>`<div class="row">${MENU.map(m=>`<button class="${m.id===rid?'on':''}" onclick="rid='${m.id}';cart={};render()">${esc(m.name)}</button>`).join('')}</div>`;

function qty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);customer()}
function customer(){
 const r=MENU.find(m=>m.id===rid),total=r.items.reduce((t,i)=>t+i.price*(cart[i.itemId]||0),0);
 $('#view').innerHTML=`<h2>Choose a restaurant</h2>${picker()}
 <div class="grid">${r.items.map(i=>`<div class="card"><b>${esc(i.name)}</b><div class="mut">${money(i.price)}</div>
  <div class="row"><button onclick="qty('${i.itemId}',-1)" aria-label="Remove one">-</button><span>${cart[i.itemId]||0}</span><button onclick="qty('${i.itemId}',1)" aria-label="Add one">+</button></div></div>`).join('')}</div>
 <div class="row"><label>Delivery address <input value="${esc(addr)}" oninput="addr=this.value"></label>
  <button class="pri" onclick="place()" ${total?'':'disabled'}>Place order for ${money(total)}</button></div>
 <h2>My orders</h2><div id="mine" class="grid"></div>`;
 mine();
}
function mine(){
 const l=orders.filter(o=>o.customerId===CFG.customerId).map(o=>orderCard(o,o.status==='CREATED'?btns(o,true).replace(/<button class="pri".*?<\/button>/,''):'')).reverse();
 $('#mine').innerHTML=l.join('')||'<p class="mut">No orders yet. Add items above and place your first order.</p>';
}
function restaurant(){
 const l=orders.filter(o=>o.restaurantId===rid&&['CREATED','CONFIRMED','PREPARING'].includes(o.status));
 $('#view').innerHTML=`<h2>Kitchen</h2>${picker()}<div class="grid">${l.map(o=>orderCard(o,btns(o,true))).join('')||'<p class="mut">No active orders for this kitchen.</p>'}</div>`;
}
function delivery(){
 const l=orders.filter(o=>['READY','OUT_FOR_DELIVERY'].includes(o.status));
 $('#view').innerHTML=`<h2>Deliveries</h2><div class="grid">${l.map(o=>orderCard(o,btns(o,false))).join('')||'<p class="mut">No orders waiting for a driver.</p>'}</div>`;
}
async function admin(){
 try{
  const m=await metrics();
  $('#view').innerHTML=`<h2>Platform metrics</h2><div class="grid">${[['Total revenue',money(m.total_revenue)],['Orders',m.total_orders],['Cancellations',m.total_cancellations],['Cancellation ratio',Number(m.cancellation_ratio_percentage).toFixed(1)+'%']]
   .map(([k,v])=>`<div class="card"><div class="mut">${k}</div><div class="big">${esc(v)}</div></div>`).join('')}</div>
   <p class="mut">Last synchronised ${esc(m.last_synchronized)}</p>`;
 }catch(e){$('#view').innerHTML=`<p class="err">Admin service unreachable (${esc(e.message)}). Check that it is running on ${esc(CFG.admin)} and allows CORS.</p>`}
}
function render(){
 $('#mode').textContent=live?'Live: calling your services':'Demo: running in the browser';
 $('#nav').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${v}</button>`).join('')+(msg?`<span class="err">${esc(msg)}</span>`:'');
 ({customer,restaurant,delivery,admin})[tab]();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(b)setStatus(b.dataset.id,b.dataset.s)});
$('#tog').onclick=async()=>{live=!live;orders=[];await load();render()};
setInterval(async()=>{if(!live)return;await load();tab==='customer'?mine():render()},4000);
render();
</script>
</body>
</html>
